version: "3.8"

services:
  hbbs:
    container_name: dxdesk-hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r ${RELAY_HOST:-127.0.0.1}:21117 -k _
    volumes:
      - dxdesk-data:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    restart: always

  hbbr:
    container_name: dxdesk-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    volumes:
      - dxdesk-data:/root
    ports:
      - "21117:21117"
      - "21119:21119"
    restart: always

volumes:
  dxdesk-data:
    name: dxdesk-data
