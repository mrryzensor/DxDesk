name: Build DxDesk From Source (100% Branded UI)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Host o Dominio del servidor'
        required: false
        default: '204.216.171.102'
      server_key:
        description: 'Clave Pública del servidor (id_ed25519.pub)'
        required: false
        default: 'NH9EpepEnWXY5I8r3lv2qnCNDxYucPzDtoBsK6imNcg='

permissions:
  contents: write
  actions: write

concurrency:
  group: build-dxdesk-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: "C:\\vcpkg"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # The pinned vcpkg revision no longer supports the x-gha backend.
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  build-windows:
    name: Build Windows Client (Source)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies for branding and portable packer
        run: |
          python -m pip install --upgrade pillow -r client/libs/portable/requirements.txt
          python -c "import PIL, brotli; print('Python packaging dependencies are available')"

      - name: Generate Icon Assets
        run: |
          python generate_assets.py

      - name: Apply DxDesk Deep UI Branding
        run: |
          $hostInput = "${{ github.event.inputs.server_host }}"
          $keyInput = "${{ github.event.inputs.server_key }}"
          if ($hostInput -and $keyInput) {
              python client-packager/apply_dxdesk_branding.py $hostInput $keyInput
          } elseif ($hostInput) {
              python client-packager/apply_dxdesk_branding.py $hostInput
          } else {
              python client-packager/apply_dxdesk_branding.py
          }

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install LLVM and NASM
        shell: pwsh
        run: |
          choco install -y llvm nasm
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: false

      - name: Install vcpkg C++ dependencies (libvpx, libyuv, opus, aom)
        shell: pwsh
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          cd client
          Write-Host "Running vcpkg install for x64-windows-static..."
          & $env:VCPKG_ROOT\vcpkg.exe install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT\installed"

      - name: Install Bridge Tools and ffigen
        shell: pwsh
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          dart pub global activate ffigen 8.0.2

      - name: Generate Dart FFI Bridge and Freezed Models
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;" + $env:PATH
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"

          # 1. Run flutter pub get in flutter project directory so .dart_tool is generated
          cd client/flutter
          flutter pub get

          # 2. Duplicate pubspec and .dart_tool to client directory so ffigen resolves regardless of working directory
          Copy-Item -Path ".dart_tool" -Destination "..\.dart_tool" -Recurse -Force
          Copy-Item -Path "pubspec.yaml" -Destination "..\pubspec.yaml" -Force
          Copy-Item -Path "pubspec.lock" -Destination "..\pubspec.lock" -Force

          # 3. Generate bridge from client/flutter
          Write-Host "Running flutter_rust_bridge_codegen from client/flutter..."
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output lib/generated_bridge.dart --rust-output ../src/bridge_generated.rs --skip-deps-check

          # 4. Fallback from client root if needed
          if (-not (Test-Path "lib/generated_bridge.dart")) {
              Write-Host "Running fallback codegen from client root..."
              cd ..
              flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart --rust-output src/bridge_generated.rs --skip-deps-check
              cd flutter
          }

          # 5. Explicitly run build_runner to guarantee generated_bridge.freezed.dart is produced
          Write-Host "Running build_runner to guarantee all Freezed models exist..."
          dart run build_runner build --delete-conflicting-outputs

          # 6. Strict validation of all bridge artifacts
          if (-not (Test-Path "lib/generated_bridge.dart")) {
              Write-Error "CRITICAL: lib/generated_bridge.dart was not created!"
              exit 1
          }
          if (-not (Test-Path "lib/generated_bridge.freezed.dart")) {
              Write-Error "CRITICAL: lib/generated_bridge.freezed.dart was not created!"
              exit 1
          }
          Write-Host "SUCCESS: Both generated_bridge.dart and generated_bridge.freezed.dart exist and are ready!"

      - name: Build Rust Core Library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd client/libs/virtual_display/dylib
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cd ../../../..
          cd client
          cargo build --features flutter --lib --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path "target/release/librustdesk.dll") {
              Write-Host "SUCCESS: target/release/librustdesk.dll compiled successfully!"
          } else {
              Write-Error "ERROR: target/release/librustdesk.dll not found."
              exit 1
          }

      - name: Build Flutter Windows App
        shell: pwsh
        run: |
          cd client/flutter
          flutter build windows --release

      - name: Build branded Windows portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "dist-windows-source" -Force | Out-Null
          if (Test-Path "client/flutter/build/windows/x64/runner/Release") {
              Copy-Item "client/flutter/build/windows/x64/runner/Release/*" "dist-windows-source/" -Recurse -Force
          } elseif (Test-Path "client/flutter/build/windows/runner/Release") {
              Copy-Item "client/flutter/build/windows/runner/Release/*" "dist-windows-source/" -Recurse -Force
          }
          if (Test-Path "client/target/release/librustdesk.dll") {
              Copy-Item "client/target/release/librustdesk.dll" "dist-windows-source/" -Force
          }
          if (Test-Path "client/target/release/deps/dylib_virtual_display.dll") {
              Copy-Item "client/target/release/deps/dylib_virtual_display.dll" "dist-windows-source/" -Force
          }
          if (-not (Test-Path "dist-windows-source/rustdesk.exe")) {
              Write-Error "Flutter no generó rustdesk.exe"
              exit 1
          }

          # RustDesk/Flutter genera una carpeta con DLL y assets. El portable
          # packer convierte esa carpeta en un único ejecutable autónomo.
          $releaseDir = (Resolve-Path "dist-windows-source").Path
          $startupExe = Join-Path $releaseDir "rustdesk.exe"
          Push-Location "client/libs/portable"
          python generate.py --folder $releaseDir --output (Get-Location).Path --executable $startupExe
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit 1 }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit 1 }
          Pop-Location

          # portable is a member of the client Cargo workspace, so Cargo normally
          # writes it to client/target. Keep the package-local path as a fallback
          # for runners or future Cargo configuration that uses a separate target.
          $portableCandidates = @(
              "client/target/release/rustdesk-portable-packer.exe",
              "client/libs/portable/target/release/rustdesk-portable-packer.exe"
          )
          $portable = $portableCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $portable) {
              Write-Error "No se generó el portable packer de RustDesk en ninguna ruta esperada"
              exit 1
          }
          Copy-Item $portable "dist-windows-source/DxDesk-Windows-x64.exe" -Force
          Copy-Item "assets/dxdesk.ico" "dist-windows-source/" -Force

          # Refuerza los metadatos del PE final, que es el archivo que se
          # descargará directamente desde GitHub Releases.
          $rcedit = "client-packager/tools/rcedit-x64.exe"
          New-Item -ItemType Directory -Path "client-packager/tools" -Force | Out-Null
          if (-not (Test-Path $rcedit)) {
              Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile $rcedit
          }
          & $rcedit "dist-windows-source/DxDesk-Windows-x64.exe" `
            --set-icon "assets/dxdesk.ico" `
            --set-version-string ProductName "DxDesk" `
            --set-version-string FileDescription "DxDesk Remote Desktop" `
            --set-version-string CompanyName "DxDesk"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Conserva el bundle completo para depuración y compatibilidad, pero
          # ya no se publica como si fuera el ejecutable portable.
          Copy-Item "assets/dxdesk.ico" "dist-windows-source/" -Force
          Compress-Archive -Path "dist-windows-source/*" -DestinationPath "DxDesk-Windows-x64-Source.zip" -Force
          Copy-Item "DxDesk-Windows-x64-Source.zip" "dist-windows-source/" -Force

      - name: Compile Official DxDesk Inno Setup Installer
        shell: pwsh
        run: |
          choco install -y innosetup
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          New-Item -ItemType Directory -Path "client-packager\output" -Force | Out-Null
          $branding = Get-Content "branding.json" -Raw | ConvertFrom-Json
          $serverHostInput = "${{ github.event.inputs.server_host }}"
          $serverKeyInput = "${{ github.event.inputs.server_key }}"
          $serverHost = if ($serverHostInput) { $serverHostInput } else { $branding.server_host }
          $serverKey = if ($serverKeyInput) { $serverKeyInput } else { $branding.server_key }
          
          @"
          custom-rendezvous-server = '$serverHost'
          key = '$serverKey'
          relay-server = '$serverHost'
          api-server = ''
          "@ | Set-Content -Path "client-packager\output\RustDesk2.toml" -Encoding UTF8
          
          Copy-Item "dist-windows-source\DxDesk-Windows-x64.exe" "dist\DxDesk.exe" -Force
          if (Test-Path $isccPath) {
              Write-Host "Compilando instalador oficial DxDesk-Windows-Setup.exe..."
              & $isccPath "client-packager\inno_setup_dxdesk.iss"
              if (Test-Path "dist\DxDesk-Setup.exe") {
                  Copy-Item "dist\DxDesk-Setup.exe" "dist-windows-source\DxDesk-Windows-Setup.exe" -Force
              } else {
                  Write-Error "Inno Setup terminó sin generar dist\DxDesk-Setup.exe"
                  exit 1
              }
          } else {
              Write-Error "Inno Setup no está disponible en el runner"
              exit 1
          }
          if (-not (Test-Path "dist-windows-source\DxDesk-Windows-x64.exe")) {
              Write-Error "Falta el ejecutable portable DxDesk-Windows-x64.exe"
              exit 1
          }
          if (-not (Test-Path "dist-windows-source\DxDesk-Windows-Setup.exe")) {
              Write-Error "Falta el instalador DxDesk-Windows-Setup.exe"
              exit 1
          }
          # PowerShell 7 does not support -Encoding Byte; read the PE prefix
          # through .NET so the validation works on the hosted Windows runner.
          $portableBytes = [System.IO.File]::ReadAllBytes((Join-Path (Get-Location) "dist-windows-source\DxDesk-Windows-x64.exe"))
          if (($portableBytes.Count -ne 2) -or ($portableBytes[0] -ne 0x4D) -or ($portableBytes[1] -ne 0x5A)) {
              Write-Error "DxDesk-Windows-x64.exe no tiene una cabecera PE válida"
              exit 1
          }
          if ((Get-Item "dist-windows-source\DxDesk-Windows-x64.exe").Length -lt 1MB) {
              Write-Error "El ejecutable portable de Windows es anormalmente pequeño"
              exit 1
          }
          if ((Get-Item "dist-windows-source\DxDesk-Windows-Setup.exe").Length -lt 1MB) {
              Write-Error "El instalador de Windows es anormalmente pequeño"
              exit 1
          }

      - name: Upload Windows DxDesk Release
        uses: actions/upload-artifact@v4
        with:
          name: DxDesk-Windows-Source-Release
          path: dist-windows-source/*

      - name: Determine release identity
        id: release
        shell: pwsh
        run: |
          $cargo = Get-Content "client/Cargo.toml" -Raw
          $versionMatch = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"')
          $version = if ($versionMatch.Success) { $versionMatch.Groups[1].Value } else { "source" }
          $sha = "${{ github.sha }}"
          if (Test-Path ".upstream-rustdesk.json") {
              $state = Get-Content ".upstream-rustdesk.json" -Raw | ConvertFrom-Json
              if ($state.commit) { $sha = $state.commit }
          }
          $tag = "v$version-main.$($sha.Substring(0, 12))"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish Official 100% Branded Windows Client to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "DxDesk ${{ steps.release.outputs.version }} (RustDesk main)"
          body: |
            Cliente Windows de DxDesk compilado desde RustDesk upstream.

            - Ejecutable portable de un solo archivo: `DxDesk-Windows-x64.exe`
            - Instalador: `DxDesk-Windows-Setup.exe`
            - Bundle completo para diagnóstico: `DxDesk-Windows-x64-Source.zip`
          files: |
            dist-windows-source/DxDesk-Windows-Setup.exe
            dist-windows-source/DxDesk-Windows-x64-Source.zip
            dist-windows-source/DxDesk-Windows-x64.exe
