name: Build DxDesk From Source (100% Branded UI)

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Host o Dominio del servidor'
        required: true
        default: '2mail.us'
      server_key:
        description: 'Clave Pública del servidor (id_ed25519.pub)'
        required: false
        default: ''

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pillow

      - name: Generate Icon Assets
        run: |
          python generate_assets.py

      - name: Apply DxDesk Deep UI Branding
        run: |
          python client-packager/apply_dxdesk_branding.py "${{ github.event.inputs.server_host }}" "${{ github.event.inputs.server_key }}"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install LLVM
        run: choco install -y llvm

      - name: Build Flutter Windows App
        shell: pwsh
        run: |
          cd client/flutter
          flutter pub get
          flutter build windows --release

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist-windows-source" -Force | Out-Null
          if (Test-Path "client/flutter/build/windows/x64/runner/Release") {
              Copy-Item "client/flutter/build/windows/x64/runner/Release/*" "dist-windows-source/" -Recurse -Force
          } elseif (Test-Path "client/flutter/build/windows/runner/Release") {
              Copy-Item "client/flutter/build/windows/runner/Release/*" "dist-windows-source/" -Recurse -Force
          }
          # Copiar icono de DxDesk
          Copy-Item "assets/dxdesk.ico" "dist-windows-source/" -Force

      - name: Upload Windows DxDesk Release
        uses: actions/upload-artifact@v4
        with:
          name: DxDesk-Windows-Source-Release
          path: dist-windows-source/*
