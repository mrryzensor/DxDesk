name: Build DxDesk Windows Client

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Host o IP de tu servidor (ej: dxdesk.tudominio.com o IP pública)'
        required: false
        default: ''
      server_key:
        description: 'Clave Pública del servidor (id_ed25519.pub)'
        required: false
        default: ''

jobs:
  build-dxdesk-client:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate Icon Assets
        run: |
          python generate_assets.py

      - name: Build Patched DxDesk Executable
        run: |
          python client-packager/build_client.py

      - name: Configure Server Credentials
        env:
          INPUT_HOST: ${{ github.event.inputs.server_host }}
          INPUT_KEY: ${{ github.event.inputs.server_key }}
          SECRET_HOST: ${{ secrets.RENDEZVOUS_SERVER }}
          SECRET_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          $HostVal = if ($env:INPUT_HOST) { $env:INPUT_HOST } elseif ($env:SECRET_HOST) { $env:SECRET_HOST } else { "127.0.0.1" }
          $KeyVal = if ($env:INPUT_KEY) { $env:INPUT_KEY } elseif ($env:SECRET_KEY) { $env:SECRET_KEY } else { "" }
          Write-Host "Configurando cliente con Servidor: $HostVal"
          python client-packager/config_encoder.py "$HostVal" "$KeyVal"

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $isccPath) {
              Write-Host "Compilando instalador oficial con Inno Setup..."
              & $isccPath "client-packager\inno_setup_dxdesk.iss"
          } else {
              Write-Warning "Inno Setup no encontrado en runner, omitiendo instalador .exe..."
          }

      - name: Package Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-bundle" -Force | Out-Null
          if (Test-Path "dist\DxDesk.exe") { Copy-Item "dist\DxDesk.exe" "release-bundle\" }
          if (Test-Path "dist\DxDesk-Setup.exe") { Copy-Item "dist\DxDesk-Setup.exe" "release-bundle\" }
          if (Test-Path "client-packager\output\RustDesk2.toml") { Copy-Item "client-packager\output\RustDesk2.toml" "release-bundle\" }
          if (Test-Path "client-packager\output\configure_client.ps1") { Copy-Item "client-packager\output\configure_client.ps1" "release-bundle\" }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DxDesk-Windows-Client
          path: release-bundle/*
