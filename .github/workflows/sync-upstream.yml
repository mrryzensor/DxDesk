name: Sync RustDesk upstream

on:
  schedule:
    # Check daily, but rebuild only when RustDesk publishes a new version tag.
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-rustdesk-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DxDesk
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install asset generator dependency
        run: python -m pip install --upgrade pillow

      - name: Generate branding assets
        run: python generate_assets.py

      - name: Sync and brand RustDesk source
        id: sync
        run: python scripts/sync_rustdesk.py

      - name: Commit upstream update
        shell: bash
        run: |
          if git diff --quiet -- client .upstream-rustdesk.json; then
            echo "RustDesk upstream no ha cambiado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A client .upstream-rustdesk.json
          upstream_sha=$(python -c "import json; print(json.load(open('.upstream-rustdesk.json', encoding='utf-8'))['commit'][:12])")
          release_version=$(python -c "import json; print(json.load(open('.upstream-rustdesk.json', encoding='utf-8'))['version'])")
          git commit -m "chore: sync RustDesk ${release_version} (${upstream_sha})"
          git push origin HEAD:main

          if [[ "${{ steps.sync.outputs.changed }}" == "true" ]]; then
            # Pushes made with GITHUB_TOKEN do not start the build workflows.
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh workflow run build-dxdesk-app.yml --ref main
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh workflow run build-dxdesk-multiplatform-source.yml --ref main
          else
            echo "RustDesk sigue en la release ${release_version}; no se recompila."
          fi
