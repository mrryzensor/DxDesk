name: Package DxDesk Official Release (Windows, Android, Linux, macOS)

on:
  schedule:
    # Empaqueta el último release oficial publicado por RustDesk.
    # La rama master se sincroniza y compila en sync-upstream.yml.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Host o IP del servidor (ej: 204.216.171.102)'
        required: false
        default: '204.216.171.102'
      server_key:
        description: 'Clave Pública del servidor (Key de id_ed25519.pub)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package-all-platforms:
    name: Package All Platforms (Windows, Android, Linux, macOS)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow qrcode

      - name: Generate Multiplatform Assets
        run: |
          python generate_assets.py

      - name: Download, Patch and Package All Platforms
        id: packager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python client-packager/build_all_platforms.py "${{ github.event.inputs.server_host || '204.216.171.102' }}" "${{ github.event.inputs.server_key || '' }}"

      - name: Install Inno Setup and Compile Windows Installer
        shell: pwsh
        run: |
          choco install -y innosetup
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          New-Item -ItemType Directory -Path "client-packager\output" -Force | Out-Null
          if (Test-Path "dist-all-platforms\RustDesk2.toml") {
              Copy-Item "dist-all-platforms\RustDesk2.toml" "client-packager\output\RustDesk2.toml" -Force
          }
          if (Test-Path "dist-all-platforms\DxDesk-Windows-x64.exe") {
              Copy-Item "dist-all-platforms\DxDesk-Windows-x64.exe" "dist\DxDesk.exe" -Force
          }
          if ((Test-Path $isccPath) -and (Test-Path "dist\DxDesk.exe")) {
              Write-Host "Compiling Windows DxDesk installer..."
              & $isccPath "client-packager\inno_setup_dxdesk.iss"
              if (Test-Path "dist\DxDesk-Setup.exe") {
                  Copy-Item "dist\DxDesk-Setup.exe" "dist-all-platforms\DxDesk-Windows-Setup.exe" -Force
              }
          }

      - name: Organize Separate Platform Packages
        shell: pwsh
        run: |
          # Carpetas individuales para descargas separadas
          New-Item -ItemType Directory -Path "dist-windows" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist-android" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist-macos" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist-linux" -Force | Out-Null

          # Windows
          Get-ChildItem "dist-all-platforms" -Filter "*Windows*" | ForEach-Object { Copy-Item $_.FullName "dist-windows/" -Force }
          Copy-Item "dist-all-platforms/configure_windows.ps1" "dist-windows/" -Force
          Copy-Item "dist-all-platforms/RustDesk2.toml" "dist-windows/" -Force

          # Android
          Get-ChildItem "dist-all-platforms" -Filter "*Android*" | ForEach-Object { Copy-Item $_.FullName "dist-android/" -Force }

          # macOS
          Get-ChildItem "dist-all-platforms" -Filter "*macOS*" | ForEach-Object { Copy-Item $_.FullName "dist-macos/" -Force }
          Copy-Item "dist-all-platforms/configure_linux_mac.sh" "dist-macos/" -Force
          Copy-Item "dist-all-platforms/RustDesk2.toml" "dist-macos/" -Force

          # Linux
          Get-ChildItem "dist-all-platforms" -Filter "*Linux*" | ForEach-Object { Copy-Item $_.FullName "dist-linux/" -Force }
          Copy-Item "dist-all-platforms/configure_linux_mac.sh" "dist-linux/" -Force
          Copy-Item "dist-all-platforms/RustDesk2.toml" "dist-linux/" -Force

          # El ZIP de Actions puede seguir existiendo como bundle auxiliar, pero
          # Releases se publica únicamente con archivos individuales.
          Compress-Archive -Path "dist-all-platforms/*" -DestinationPath "DxDesk-All-Platforms.zip" -Force

          $required = @(
            "DxDesk-Windows-Setup.exe",
            "DxDesk-Windows-x64.exe",
            "DxDesk-Android-Universal.apk",
            "DxDesk-Android-arm64.apk",
            "DxDesk-macOS-AppleSilicon.dmg",
            "DxDesk-macOS-Intel.dmg",
            "DxDesk-Linux-x64.deb",
            "DxDesk-Linux-x64.AppImage"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path "dist-all-platforms" $_)) }
          if ($missing) {
            Write-Error ("Faltan paquetes individuales: " + ($missing -join ", "))
            exit 1
          }

      - name: Publish Direct Downloads to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}"
          name: "DxDesk ${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }} (Archivos individuales)"
          body: |
            ### 🚀 Clientes DxDesk basados en el último release oficial de RustDesk
            > Para builds desde `master`, usa la release `RustDesk main` del workflow de sincronización.
            Descarga directamente el archivo según tu sistema operativo (sin necesidad de descomprimir):

            - 🪟 **Windows Instalador (.exe):** [DxDesk-Windows-Setup.exe](https://github.com/${{ github.repository }}/releases/download/official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}/DxDesk-Windows-Setup.exe)
            - 🪟 **Windows Portable (.exe):** [DxDesk-Windows-x64.exe](https://github.com/${{ github.repository }}/releases/download/official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}/DxDesk-Windows-x64.exe)
            - 📱 **Android Universal (.apk):** [DxDesk-Android-Universal.apk](https://github.com/${{ github.repository }}/releases/download/official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}/DxDesk-Android-Universal.apk)
            - 📱 **Android ARM64 (.apk):** [DxDesk-Android-arm64.apk](https://github.com/${{ github.repository }}/releases/download/official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}/DxDesk-Android-arm64.apk)
            - 🍎 **macOS Apple Silicon M1-M4 (.dmg):** [DxDesk-macOS-AppleSilicon.dmg](https://github.com/${{ github.repository }}/releases/download/official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}/DxDesk-macOS-AppleSilicon.dmg)
            - 🍎 **macOS Intel (.dmg):** [DxDesk-macOS-Intel.dmg](https://github.com/${{ github.repository }}/releases/download/official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}/DxDesk-macOS-Intel.dmg)
            - 🐧 **Linux Debian/Ubuntu (.deb):** [DxDesk-Linux-x64.deb](https://github.com/${{ github.repository }}/releases/download/official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}/DxDesk-Linux-x64.deb)
            - 🐧 **Linux AppImage Universal (.AppImage):** [DxDesk-Linux-x64.AppImage](https://github.com/${{ github.repository }}/releases/download/official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}/DxDesk-Linux-x64.AppImage)
            - 📲 **Código QR de Sincronización:** [DxDesk-Android-QR-Config.png](https://github.com/${{ github.repository }}/releases/download/official-${{ steps.packager.outputs.version || env.DXDESK_VERSION || 'v1.4.9' }}/DxDesk-Android-QR-Config.png)
            **Servidor predeterminado:** `${{ github.event.inputs.server_host || '204.216.171.102' }}`
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist-all-platforms/DxDesk-Windows-Setup.exe
            dist-all-platforms/DxDesk-Windows-x64.exe
            dist-all-platforms/DxDesk-Android-Universal.apk
            dist-all-platforms/DxDesk-Android-arm64.apk
            dist-all-platforms/DxDesk-macOS-AppleSilicon.dmg
            dist-all-platforms/DxDesk-macOS-Intel.dmg
            dist-all-platforms/DxDesk-Linux-x64.deb
            dist-all-platforms/DxDesk-Linux-x64.AppImage
            dist-all-platforms/DxDesk-Android-QR-Config.png
            dist-all-platforms/RustDesk2.toml
